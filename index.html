<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <script src="https://unpkg.com/chart.js@3.7.0/dist/chart.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Smart Expense Tracker</h1>
        
        <!-- Dashboard Summary -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-600">Monthly Total</h3>
                <p class="text-2xl font-bold text-blue-600" id="monthlyTotal">Rs.0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-600">Highest Expense</h3>
                <p class="text-2xl font-bold text-red-600" id="highestExpense">Rs.0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-600">Top Category</h3>
                <p class="text-2xl font-bold text-green-600" id="topCategory">None</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-600">Monthly Savings</h3>
                <p class="text-2xl font-bold text-purple-600" id="monthlySavings">Rs.0</p>
            </div>
        </div>

        <!-- Add Expense Form -->
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-semibold mb-4">Add New Expense</h2>
            <form id="expenseForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <input type="text" id="title" placeholder="Title" required class="p-2 border rounded">
                <input type="number" id="amount" placeholder="Amount" required class="p-2 border rounded">
                <select id="category" required class="p-2 border rounded">
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
		    <option value="Travelling">Travelling</option>
		    <option value="Accessoris">Accessories</option>
		    <option value="hospital/Medicine">Hospital/Medicine</option>
		    <option value="Electricity">Electricity Bills</option>
                    <option value="Entertainment">Entertainment</option>
                </select>
                <input type="date" id="date" required class="p-2 border rounded">
                <input type="text" id="notes" placeholder="Notes" class="p-2 border rounded">
                <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Add Expense</button>
            </form>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">Monthly Trend</h2>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">Category Distribution</h2>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- AI Insights -->
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-semibold mb-4">Smart Insights</h2>
            <div id="aiInsights" class="space-y-2">
                <!-- AI suggestions will be inserted here -->
            </div>
        </div>

        <!-- Expense List -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Recent Expenses</h2>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="p-3 text-left">Date</th>
                            <th class="p-3 text-left">Title</th>
                            <th class="p-3 text-left">Category</th>
                            <th class="p-3 text-left">Amount</th>
                            <th class="p-3 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        function saveExpenses() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        document.getElementById('expenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const expense = {
                id: Date.now(),
                title: document.getElementById('title').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                notes: document.getElementById('notes').value
            };
            expenses.push(expense);
            saveExpenses();
            updateUI();
            e.target.reset();
        });

        function deleteExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            saveExpenses();
            updateUI();
        }

        function editExpense(id) {
            const expense = expenses.find(exp => exp.id === id);
            document.getElementById('title').value = expense.title;
            document.getElementById('amount').value = expense.amount;
            document.getElementById('category').value = expense.category;
            document.getElementById('date').value = expense.date;
            document.getElementById('notes').value = expense.notes;
            deleteExpense(id);
        }

        function updateUI() {
            // Update expense list
            const expenseList = document.getElementById('expenseList');
            expenseList.innerHTML = '';
            expenses.sort((a, b) => new Date(b.date) - new Date(a.date))
                .forEach(expense => {
                    expenseList.innerHTML += `
                        <tr class="border-b">
                            <td class="p-3">${expense.date}</td>
                            <td class="p-3">${expense.title}</td>
                            <td class="p-3">${expense.category}</td>
                            <td class="p-3">Rs.${expense.amount.toFixed(2)}</td>
                            <td class="p-3">
                                <button onclick="editExpense(${expense.id})" class="text-blue-600 mr-2">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button onclick="deleteExpense(${expense.id})" class="text-red-600">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

            // Update dashboard
            const currentMonth = new Date().getMonth();
            const monthlyExpenses = expenses.filter(exp => new Date(exp.date).getMonth() === currentMonth);
            const monthlyTotal = monthlyExpenses.reduce((sum, exp) => sum + exp.amount, 0);
            document.getElementById('monthlyTotal').textContent = `Rs.${monthlyTotal.toFixed(2)}`;

            const highestExpense = Math.max(...expenses.map(exp => exp.amount));
            document.getElementById('highestExpense').textContent = `Rs.${highestExpense.toFixed(2)}`;

            const categoryTotals = expenses.reduce((acc, exp) => {
                acc[exp.category] = (acc[exp.category] || 0) + exp.amount;
                return acc;
            }, {});
            const topCategory = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('topCategory').textContent = topCategory ? topCategory[0] : 'None';

            // Update charts
            updateCharts();
            updateAIInsights(monthlyTotal, categoryTotals);
        }

        function updateCharts() {
            // Monthly trend chart
            const ctx1 = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: [...new Set(expenses.map(exp => exp.date))].sort(),
                    datasets: [{
                        label: 'Daily Expenses',
                        data: expenses.reduce((acc, exp) => {
                            acc[exp.date] = (acc[exp.date] || 0) + exp.amount;
                            return acc;
                        }, {}),
                        borderColor: 'rgb(59, 130, 246)',
                        tension: 0.1
                    }]
                }
            });

            // Category pie chart
            const ctx2 = document.getElementById('pieChart').getContext('2d');
            const categoryData = expenses.reduce((acc, exp) => {
                acc[exp.category] = (acc[exp.category] || 0) + exp.amount;
                return acc;
            }, {});

            new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: Object.keys(categoryData),
                    datasets: [{
                        data: Object.values(categoryData),
                        backgroundColor: [
                            '#3B82F6', '#EF4444', '#10B981', '#F59E0B', '#6366F1'
                        ]
                    }]
                }
            });
        }

        function updateAIInsights(monthlyTotal, categoryTotals) {
            const insights = document.getElementById('aiInsights');
            insights.innerHTML = '';

            // Simple AI insights based on spending patterns
            const recommendedSavings = monthlyTotal * 0.2;
            const highSpendingCategories = Object.entries(categoryTotals)
                .filter(([_, amount]) => amount > monthlyTotal * 0.3);

            insights.innerHTML += `
                <p class="text-gray-700">💡 Recommended monthly savings: Rs${recommendedSavings.toFixed(2)}</p>
                ${highSpendingCategories.map(([category]) => 
                    `<p class="text-gray-700">⚠️ Consider reducing spending in ${category}</p>`
                ).join('')}
                <p class="text-gray-700">🎯 Set a budget limit of Rs${(monthlyTotal * 0.9).toFixed(2)} for next month</p>
            `;
        }

        // Initial UI update
        updateUI();
    </script>
</body>
</html>
